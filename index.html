<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>សុំច្បាប់</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Noto Sans Khmer', system-ui, sans-serif; }
    .swal-min { border-radius: 4px !important; font-family: 'Noto Sans Khmer', system-ui, sans-serif; }
    .swal-min .swal2-confirm { border-radius: 2px !important; box-shadow: none !important; }
    #noBtn { will-change: transform; }
    #noBtn.fly { transition: transform .7s cubic-bezier(.22, 1, .36, 1); }
  </style>
</head>
<body class="min-h-screen bg-white text-neutral-900 flex items-center justify-center px-6 overflow-hidden">

  <main class="w-full max-w-md">
    <h1 class="text-xl font-semibold leading-relaxed">
      មេសុំច្បាប់ ២ ថ្ងៃ
    </h1>

    <div class="mt-4 border-t border-neutral-200 pt-4 space-y-2 text-neutral-700 leading-relaxed">
      <p>គឺថ្ងៃទី ១៣ និងថ្ងៃទី ១៤ ខែតុលា ឆ្នាំ ២០២៦</p>
      <p>ថ្ងៃភ្ចំហើយ (Phnom Ben)</p>
      <p><span class="text-neutral-400">មូលហេតុ:</span> ស្រវឹងមិនទាន់ស្វាង</p>
    </div>

    <div class="mt-8 flex items-center gap-3 min-h-[44px]">
      <button id="yesBtn"
        class="px-6 py-2 bg-neutral-900 text-white text-sm rounded-sm hover:bg-neutral-700 transition">
        យល់ព្រម (Yes)
      </button>
      <span id="noSlot" class="inline-block">
        <button id="noBtn" type="button" tabindex="-1"
          class="px-6 py-2 border border-neutral-300 text-neutral-700 text-sm rounded-sm select-none bg-white">
          មិនយល់ព្រម (No)
        </button>
      </span>
    </div>

    <p id="msg" class="mt-6 text-sm text-neutral-500 h-5"></p>
  </main>

<script>
  const yesBtn = document.getElementById("yesBtn");
  const noBtn  = document.getElementById("noBtn");
  const msg    = document.getElementById("msg");

  yesBtn.addEventListener("click", () => {
    yesBtn.disabled = true;
    yesBtn.classList.add("opacity-50");
    Swal.fire({
      icon: "success",                 // green check icon
      title: "អរគុណមេ 🙏",
      confirmButtonText: "OK",
      confirmButtonColor: "#171717",
      timer: 3000,
      timerProgressBar: true,
      customClass: { popup: "swal-min" },
    });
  });

  // NO button runs away - it can never be clicked
  const slot = document.getElementById("noSlot");
  let started = false, x = 0, y = 0, lastMove = 0;
  let mouse = { x: -999, y: -999 };

  function start() {
    // keep its place in the layout, then lift the button out as fixed
    const r = noBtn.getBoundingClientRect();
    slot.style.width = r.width + "px";
    slot.style.height = r.height + "px";
    noBtn.style.position = "fixed";
    noBtn.style.left = "0";
    noBtn.style.top = "0";
    noBtn.style.zIndex = 50;
    x = r.left; y = r.top;
    noBtn.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    noBtn.getBoundingClientRect();          // force reflow before enabling transition
    noBtn.classList.add("fly");
    started = true;
  }

  function runAway(px = mouse.x, py = mouse.y) {
    const now = performance.now();
    if (now - lastMove < 250) return;       // let the glide finish a bit
    lastMove = now;
    if (!started) start();

    const pad = 16, w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    const maxX = window.innerWidth - w - pad, maxY = window.innerHeight - h - pad;
    let nx = x, ny = y;
    for (let i = 0; i < 25; i++) {          // pick a spot far from the cursor
      nx = pad + Math.random() * Math.max(0, maxX - pad);
      ny = pad + Math.random() * Math.max(0, maxY - pad);
      if (Math.hypot(nx + w / 2 - px, ny + h / 2 - py) > 220) break;
    }
    x = nx; y = ny;
    noBtn.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  }

  ["pointerenter", "pointerdown", "touchstart", "focus"].forEach(ev =>
    noBtn.addEventListener(ev, e => {
      e.preventDefault();
      const t = e.touches ? e.touches[0] : e;
      runAway(t.clientX ?? mouse.x, t.clientY ?? mouse.y);
    }, { passive: false })
  );
  noBtn.addEventListener("click", e => { e.preventDefault(); e.stopImmediatePropagation(); runAway(); }, true);

  // start gliding away before the cursor even reaches it
  document.addEventListener("pointermove", e => {
    mouse = { x: e.clientX, y: e.clientY };
    const r = noBtn.getBoundingClientRect();
    if (Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) < 120) runAway();
  });
  window.addEventListener("resize", () => { if (started) { lastMove = 0; runAway(); } });
</script>
</body>
</html>
